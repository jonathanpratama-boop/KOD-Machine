name: checks

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read  # KOD reads GitHub's own workflow-run records as server-side timestamp receipts

jobs:
  workstation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r kod-machine/requirements-workstation.txt
      - name: Audit optional application dependencies against known advisories
        run: |
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit -r kod-machine/requirements-workstation.txt --progress-spinner off
      - name: Optional workstation integration, recovery, source-boundary and web tests
        working-directory: kod-machine
        run: python3 -m unittest discover -s workstation_tests -v
      - name: Four preserved real-company releases replay offline
        working-directory: kod-machine
        run: python3 -m kod.workstation demo --data-dir "$RUNNER_TEMP/kod-workstation-demo"
      - name: Analyst-task evaluation (fails on a material error or answers that differ between two fresh runs)
        working-directory: kod-machine
        run: python3 evaluation/run_eval.py --runs 2
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r idx-signals/requirements.txt
      - name: No past run, manifest, registry, card or log line was edited (whole history)
        run: python3 tools/check_append_only.py --all
      - name: KOD tests
        working-directory: kod-machine
        run: python3 -m unittest
      - name: KOD verify (rebuild every card hash, check git anchors, TSA tokens and GitHub receipts)
        working-directory: kod-machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m kod verify
      - name: GitHub receipt for this very commit (server-side created_at, exact head_sha)
        if: github.event_name == 'push'
        working-directory: kod-machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m kod receipt-selftest --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: IDX harness tests
        working-directory: idx-signals
        run: python3 -m unittest
      - name: IDX rules pass the causal-source audit
        working-directory: idx-signals
        run: python3 -m idxsig rules
      - name: IDX runs match their recorded hashes
        working-directory: idx-signals
        run: python3 -m idxsig verify-runs
