name: LLM ARM readiness watch

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit every retained LLM ARM v1 call
        run: python tools/watch_llm_arm.py --output "$RUNNER_TEMP/llm-arm-watch"
      - name: Retain audit snapshots and local journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-arm-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/llm-arm-watch/
          retention-days: 90
          if-no-files-found: warn
